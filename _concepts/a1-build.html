<script>document.documentElement.classList.add("js");try{var t=localStorage.getItem("jsds-theme");if(t==="dark"||t==="light")document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>

<style>
/* A1 Build — 큰 단어 넷 사이에 도형. 들어올 때 차례로 · 알약 토글 · 패럴랙스 · 단어 hover 에 짝 도형 · 도형 누르면 색 */
.a1{--fs:clamp(3rem,min(9.6vw,16vh),9.5rem)}
.a1-type{font-size:var(--fs);display:flex;flex-direction:column;gap:0.04em}
.a1 .l3,.a1 .l4{margin-left:22%}
.a1-key{position:relative;width:1.3em;height:0.62em;flex:none;display:inline-block}
.a1-key .sh.c{position:absolute;right:0.12em;top:0}
.a1-key svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;fill:none;stroke:var(--c-ink);stroke-width:9;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.a1-key svg path,.a1-key svg circle{stroke-dasharray:var(--len);--len:200}
.js .go .a1-key svg path,.js .go .a1-key svg circle{animation:cx-draw 1s var(--ease-out) .55s both}
.a1-up{width:0.5em;height:0.62em;flex:none;margin:0 0.06em;transition:translate .35s var(--ease-pop)}
.a1-up svg{width:100%;height:100%;fill:none;stroke:var(--c-ink);stroke-width:11;stroke-linecap:butt;stroke-linejoin:miter}
.l1:hover .a1-up{translate:0.08em -0.08em}
.a1-x{width:0.26em;height:0.26em;flex:none}
.a1-x svg{width:100%;height:100%;fill:none;stroke:var(--c-ink);stroke-width:5;stroke-linecap:round}
.a1-pill{width:1.42em;height:0.66em;border-radius:999px;margin-left:0.1em;display:inline-flex;align-items:center;padding:0 0.07em;transition:background-color .45s var(--ease-out),translate .6s var(--ease-out)}
.a1-pill.off{background-color:var(--c-amber);background-image:none}
.a1-pill .ball{width:0.5em;height:0.5em;border-radius:50%;background:var(--c-coral);flex:none;transition:opacity .4s,scale .5s var(--ease-pop)}
.a1-pill .dash{flex:1;height:0;border-top:0.05em dashed var(--c-ink);margin:0 0.06em;opacity:.85}
.a1-pill .knob{position:absolute;right:0.07em;top:50%;width:0.44em;height:0.44em;margin-top:-0.22em;border-radius:50%;border:0.075em solid var(--c-ink);background:var(--static-white);transition:right .55s var(--ease-pop)}
.a1-pill.off .knob{right:calc(100% - 0.51em)}
.a1-pill.off .ball{opacity:0;scale:.3}
.a1-word-u{position:relative}
.a1-word-u::after{content:"";position:absolute;left:0;right:0;bottom:-0.06em;height:0.07em;border-radius:999px;background:var(--c-ink);transform-origin:left}
.js .go .a1-word-u::after{animation:a1-line .9s var(--ease-out) .9s both}
@keyframes a1-line{from{transform:scaleX(0)}}
.a1-star{width:0.26em;height:0.26em;margin-left:0.06em}
.a1-star svg{width:100%;height:100%;fill:none;stroke:var(--c-ink);stroke-width:3.2;stroke-linecap:round}
.a1-tris{display:inline-flex;gap:0.03em;margin-left:0.14em}
.a1-tris .sh.tri{width:0.72em;height:0.72em}
.a1-intro{position:absolute;left:0;bottom:clamp(2rem,5vw,4rem)}
@media (prefers-reduced-motion: reduce){.a1-pill,.a1-pill .knob,.a1-pill .ball{transition:none}}
@media (max-width:1023px){.a1 .l3,.a1 .l4{margin-left:12%}.a1-intro{position:static;margin-top:2.5rem}}
@media (max-width:767px){.a1 .l3,.a1 .l4{margin-left:0}.a1 .cx-line{flex-wrap:nowrap;white-space:nowrap}}
</style>
<script src="../assets/app.js" defer></script>

    <div class="cx-intro a1-intro rise">
