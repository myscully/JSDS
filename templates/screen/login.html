          <div class="field"><label for="si-pw" class="sr-only">비밀번호</label><div class="affix"><span class="field-icon" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 13a2 2 0 0 1 2 -2h10a2 2 0 0 1 2 2v6a2 2 0 0 1 -2 2h-10a2 2 0 0 1 -2 -2v-6"/><path d="M11 16a1 1 0 1 0 2 0a1 1 0 0 0 -2 0"/><path d="M8 11v-4a4 4 0 1 1 8 0v4"/></svg></span><input id="si-pw" type="password" placeholder="비밀번호" autocomplete="current-password" required data-messages='{"required":"비밀번호를 입력하세요."}'><button type="button" class="reveal" aria-label="비밀번호 표시" aria-pressed="false"><span class="i-show"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 12a2 2 0 1 0 4 0a2 2 0 0 0 -4 0"/><path d="M21 12c-2.4 4 -5.4 6 -9 6c-3.6 0 -6.6 -2 -9 -6c2.4 -4 5.4 -6 9 -6c3.6 0 6.6 2 9 6"/></svg></span><span class="i-hide"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.585 10.587a2 2 0 0 0 2.829 2.828"/><path d="M16.681 16.673a8.717 8.717 0 0 1 -4.681 1.327c-3.6 0 -6.6 -2 -9 -6c1.272 -2.12 2.712 -3.678 4.32 -4.674m2.86 -1.146a9.055 9.055 0 0 1 1.82 -.18c3.6 0 6.6 2 9 6c-.666 1.11 -1.379 2.067 -2.138 2.87"/><path d="M3 3l18 18"/></svg></span></button></div><span class="help" aria-live="polite"></span></div>

  <form class="form auth" id="tpl-otp" hidden data-validate novalidate>

          <div><h1 class="auth-title t-title-3">2단계 인증</h1><p class="auth-desc">인증 앱에 표시된 6자리 숫자를 입력하세요.</p><p class="auth-account"><b>admin@jiran.com</b><a href="#" class="link standalone">다른 계정으로 로그인</a></p></div>
          <div class="field code-field"><label id="si-otp-l" for="si-otp-1">인증 코드</label><div class="code-inputs" role="group" aria-labelledby="si-otp-l" aria-describedby="si-otp-help" data-name="otp" data-required data-messages='{"required":"인증 코드를 입력하세요.","code":"숫자 6자리를 모두 입력하세요."}'><input type="hidden" name="otp" value=""><input id="si-otp-1" class="code-cell" type="text" inputmode="numeric" autocomplete="one-time-code" aria-label="6자리 중 1번째"><input class="code-cell" type="text" inputmode="numeric" autocomplete="off" aria-label="6자리 중 2번째" tabindex="-1"><input class="code-cell" type="text" inputmode="numeric" autocomplete="off" aria-label="6자리 중 3번째" tabindex="-1"><input class="code-cell" type="text" inputmode="numeric" autocomplete="off" aria-label="6자리 중 4번째" tabindex="-1"><input class="code-cell" type="text" inputmode="numeric" autocomplete="off" aria-label="6자리 중 5번째" tabindex="-1"><input class="code-cell" type="text" inputmode="numeric" autocomplete="off" aria-label="6자리 중 6번째" tabindex="-1"></div><span class="help" id="si-otp-help" aria-live="polite">코드는 30초마다 바뀝니다.</span></div>

          <button type="submit" class="btn lg solid primary">인증하고 로그인</button>
